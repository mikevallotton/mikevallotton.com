name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      # Temporary visibility-only check while the transitive nanoid advisory
      # has no upstream fix. Remove continue-on-error once a patched path exists.
      - name: Report high-severity production dependency advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Start production server
        run: npm run start &

      - name: Wait for production server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Smoke test
        run: npm run smoke -- http://127.0.0.1:3000
